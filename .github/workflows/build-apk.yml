name: Build APK
# Builds a release APK on every push to main that touches the app, and on demand.
# Download it from the run page: Actions -> the run -> Artifacts.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Type check and tests
        working-directory: app
        run: |
          npm run typecheck
          npm test
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DIRECT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/direct.p12"
            echo "DIRECT_KEYSTORE_FILE=$RUNNER_TEMP/direct.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key is stored (secret DIRECT_KEYSTORE_BASE64). This APK is signed with the public debug key and cannot update an install made with the real key. See docs/SIGNING.md."
          fi
      - name: Build release APK
        working-directory: app/android
        env:
          DIRECT_KEYSTORE_PASSWORD: ${{ secrets.DIRECT_KEYSTORE_PASSWORD }}
          DIRECT_KEY_ALIAS: ${{ secrets.DIRECT_KEY_ALIAS }}
          DIRECT_KEY_PASSWORD: ${{ secrets.DIRECT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the signature
        run: bash scripts/check-apk-signature.sh app/android/app/build/outputs/apk/release/app-release.apk
      - name: Name the APK
        id: name
        run: |
          VER=$(node -p "require('./app/package.json').version")
          echo "file=Direct-${VER}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          cp app/android/app/build/outputs/apk/release/app-release.apk "Direct-${VER}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
          if-no-files-found: error
