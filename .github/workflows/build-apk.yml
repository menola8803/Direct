name: Build APK
# Builds a release APK on every push to main that touches the app, and on demand.
# Download it from the run page: Actions -> the run -> Artifacts.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Type check and tests
        working-directory: app
        run: |
          npm run typecheck
          npm test
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        id: name
        run: |
          VER=$(node -p "require('./app/package.json').version")
          echo "file=Direct-${VER}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          cp app/android/app/build/outputs/apk/release/app-release.apk "Direct-${VER}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
          if-no-files-found: error
