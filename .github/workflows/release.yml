name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -qr "direct-${TAG}.zip" . -x '.git/*'
          # The release may already exist (e.g. created by hand with an APK): then only add the zip.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "direct-${TAG}.zip" --clobber
          else
            gh release create "$TAG" "direct-${TAG}.zip" --title "Direct ${TAG}" --generate-notes
          fi

  apk:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run tests
        working-directory: app
        run: npm test
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      # Direct's own signing key is used when the secret is stored. Once app/signing/cert-sha256.txt exists in the repository
      # (made by scripts/new-signing-key.sh) a release MUST be signed with that key: without the secret the build stops here,
      # and the signature check below stops it too if the APK was signed with anything else. Before that file exists the
      # release is signed with the public debug key as in earlier versions, so phones can still update in place.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DIRECT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/direct.p12"
            echo "DIRECT_KEYSTORE_FILE=$RUNNER_TEMP/direct.p12" >> "$GITHUB_ENV"
          elif [ -s app/signing/cert-sha256.txt ]; then
            echo "::error::app/signing/cert-sha256.txt says releases are signed with Direct's own key, but the secret DIRECT_KEYSTORE_BASE64 is missing. See docs/SIGNING.md."
            exit 1
          else
            echo "::warning::No signing key is stored: this release is signed with the public debug key (see docs/SIGNING.md)."
          fi
      - name: Build release APK
        working-directory: app/android
        env:
          DIRECT_KEYSTORE_PASSWORD: ${{ secrets.DIRECT_KEYSTORE_PASSWORD }}
          DIRECT_KEY_ALIAS: ${{ secrets.DIRECT_KEY_ALIAS }}
          DIRECT_KEY_PASSWORD: ${{ secrets.DIRECT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the signature
        run: bash scripts/check-apk-signature.sh app/android/app/build/outputs/apk/release/app-release.apk
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/android/app/build/outputs/apk/release/app-release.apk "Direct-${TAG}.apk"
          # Fixed name: https://github.com/<owner>/<repo>/releases/latest/download/Direct.apk always points at the newest release.
          cp "Direct-${TAG}.apk" Direct.apk
          gh release upload "$TAG" "Direct-${TAG}.apk" Direct.apk --clobber
