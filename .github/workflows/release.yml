name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -qr "direct-${TAG}.zip" . -x '.git/*'
          # The release may already exist (e.g. created by hand with an APK): then only add the zip.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "direct-${TAG}.zip" --clobber
          else
            gh release create "$TAG" "direct-${TAG}.zip" --title "Direct ${TAG}" --generate-notes
          fi

  apk:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run tests
        working-directory: app
        run: npm test
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/android/app/build/outputs/apk/release/app-release.apk "Direct-${TAG}.apk"
          gh release upload "$TAG" "Direct-${TAG}.apk" --clobber
