name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skapa release med zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -qr "direct-design-${TAG}.zip" . -x '.git/*'
          gh release create "$TAG" "direct-design-${TAG}.zip" --title "Direct ${TAG}" --generate-notes
